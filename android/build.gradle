// Корневой build-файл Colemailer.
//
// Связка версий (сверено с матрицей Chaquopy):
//   AGP 8.7.3  -> Gradle 8.9, compileSdk/targetSdk 35
//   Chaquopy 16.1.0 поддерживает AGP 7.0-8.13 и Python 3.8-3.13
//   Kotlin 2.0.21 работает с AGP 8.7
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'com.chaquo.python' version '16.1.0' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
