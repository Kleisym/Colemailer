pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // артефакты Chaquopy (плагин и рантайм Python) живут только здесь
        maven { url "https://chaquo.com/maven" }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
}

rootProject.name = "Colemailer"
include ':app'
