name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

# Два пуша подряд на один ref не должны гоняться за один и тот же тег.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_VER: "3.11"
  PY_SRC: android/app/src/main/python

jobs:
  test:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # В репозитории android/app/src/main/python/ лежит только bot_bridge.py —
      # его удалять нельзя. Перезаписываем только генерируемые bot.py и cole/.
      - name: Prepare Android python sources
        run: |
          mkdir -p "$PY_SRC"
          rm -rf "$PY_SRC/cole" "$PY_SRC/bot.py"
          cp bot.py "$PY_SRC/bot.py"
          cp -r cole "$PY_SRC/cole"
          find "$PY_SRC" -name '__pycache__' -prune -exec rm -rf {} +
          find "$PY_SRC" -name '*.pyc' -delete
          test -f "$PY_SRC/bot_bridge.py"
          test -f "$PY_SRC/cole/cacert.pem"
          test -f "$PY_SRC/cole/api_autoreg.py"
          ls -la "$PY_SRC" "$PY_SRC/cole"

      - name: Compile the Android python tree
        run: |
          python -m py_compile bot.py "$PY_SRC/bot_bridge.py"
          python -m compileall -q cole

      # Запуск именно из копии: иначе `import bot` подхватит корневой bot.py
      # и проверит не то, что попадёт в APK.
      - name: Smoke-import the Android python tree
        working-directory: android/app/src/main/python
        run: |
          python - <<'EOF'
          import bot
          import cole.buttons
          import cole.api_autoreg
          import cole.version
          import bot_bridge
          print("android python tree imports OK:", cole.version.VERSION)
          EOF

      - name: Run test suite
        run: python -m pytest tests -q

  build:
    name: Build & Release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # Chaquopy собирает pip-пакеты хостовым Python той же версии (3.11).
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VER }}

      - name: Check signing key
        run: |
          if [ ! -f android/app/colemailer.keystore ]; then
            echo "::error::android/app/colemailer.keystore отсутствует — APK не установится поверх предыдущего"
            exit 1
          fi

      - name: Prepare Android python sources
        run: |
          mkdir -p "$PY_SRC"
          rm -rf "$PY_SRC/cole" "$PY_SRC/bot.py"
          cp bot.py "$PY_SRC/bot.py"
          cp -r cole "$PY_SRC/cole"
          find "$PY_SRC" -name '__pycache__' -prune -exec rm -rf {} +
          find "$PY_SRC" -name '*.pyc' -delete
          test -f "$PY_SRC/bot_bridge.py"
          ls -la "$PY_SRC" "$PY_SRC/cole"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Verify signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          SIGNER=$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          if [ -n "${{ vars.EXPECTED_CERT_SHA256 }}" ]; then
            grep -qi "${{ vars.EXPECTED_CERT_SHA256 }}" certs.txt || {
              echo "::error::подпись APK изменилась — обновления перестанут ставиться"
              exit 1
            }
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          VER=$(python -c "from cole.version import VERSION; print(VERSION)")
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" dist/colemailer.apk
          sha256sum dist/colemailer.apk > dist/colemailer.apk.sha256
          echo "VER=$VER" >> "$GITHUB_ENV"
          cat dist/colemailer.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: colemailer-apk
          path: dist/*
          retention-days: 30

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VER) }}
          target_commitish: ${{ github.sha }}
          name: Colemailer ${{ env.VER }}
          make_latest: true
          body: |
            Версия ${{ env.VER }}. Сборка ${{ github.sha }}.

            **Как поставить**

            1. Скачайте `colemailer.apk` ниже и откройте на телефоне (разрешите установку из этого источника).
            2. Запустите приложение: вкладка «Подключение» — api_id, api_hash и номер телефона. Если ключей нет, нажмите «Получить автоматически»: код придёт в Telegram от сервиса.
            3. Дайте уведомления, отключите оптимизацию батареи, включите автозапуск — приложение проведёт по шагам само.

            **Это другой пакет**

            applicationId теперь `com.colemailer.app`. Старый Spambuster (`com.spambuster.app`) надо удалить: поставить новый APK поверх него нельзя, а сессия Telegram, config.txt и база рассылок не переносятся — данные вводятся заново. Дальше обновления `colemailer.apk` ставятся поверх: ключ подписи один и тот же.

            **Что изменилось**

            - фон: тип сервиса `specialUse`, без постоянного wakelock и без «пинка» раз в 10 минут — точный будильник на время ближайшей задачи плюс страховка WorkManager;
            - вход и пароль 2FA спрашиваются уведомлением: экран можно закрыть, запрос останется в сервисе;
            - экран «Работа в фоне» с чек-листом и точными экранами автозапуска для MIUI/HyperOS, EMUI/Honor, OneUI, ColorOS/Oppo/Realme/OnePlus, vivo/iQOO, Meizu, Asus, Letv, Transsion;
            - статус и лог переживают перезапуск приложения;
            - авто-получение api_id/api_hash через my.telegram.org.

            Контрольная сумма — в файле `colemailer.apk.sha256` рядом с APK.
          files: |
            dist/colemailer.apk
            dist/colemailer.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
